[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-learning-lab"
version = "0.2.0"
description = "Laboratoire expérimental : apprentissage par Shadow Memory, récompense globale et plasticité locale"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
